<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="#3b82f6" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- 3D Box Illustration -->
  <g transform="translate(106, 110)">
    <!-- Top Face -->
    <path d="M150 20 L270 80 L150 140 L30 80 Z" fill="url(#accentGrad)"/>
    <!-- Left Face -->
    <path d="M30 80 L150 140 L150 260 L30 200 Z" fill="url(#boxGrad)"/>
    <!-- Right Face -->
    <path d="M150 140 L270 80 L270 200 L150 260 Z" fill="#1e40af"/>
    <!-- Tape / Ribbon Detail -->
    <path d="M135 28 L165 42 L165 252 L135 240 Z" fill="#f59e0b" fill-opacity="0.9"/>
  </g>

  <!-- Barcode Scanner Beam -->
  <line x1="80" y1="260" x2="432" y2="260" stroke="#ef4444" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 8"/>
  <circle cx="80" cy="260" r="8" fill="#ef4444"/>
  <circle cx="432" cy="260" r="8" fill="#ef4444"/>
</svg>
